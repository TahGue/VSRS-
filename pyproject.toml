[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsrs"
version = "1.1.0"
description = "Verified Software Reasoning System - evidence-grounded coding reasoning and verification platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "httpx>=0.25",
]
llm = [
    "openai>=1.0",
]
llm-anthropic = [
    "anthropic>=0.30",
]
all = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "httpx>=0.25",
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.scripts]
vsrs = "vsrs.cli:app"

[project.entry-points."vsrs.plugins"]
file-size-verifier = "vsrs.plugins.builtin:FileSizeVerifier"
import-checker = "vsrs.plugins.builtin:ImportCheckerVerifier"
git-log-retriever = "vsrs.plugins.builtin:GitLogRetriever"
minimality-critic = "vsrs.plugins.builtin:MinimalityCritic"
security-critic = "vsrs.plugins.builtin:SecurityCritic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
