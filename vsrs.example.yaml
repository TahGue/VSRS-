# VSRS Configuration File
# Copy to vsrs.yaml and customize as needed.

database:
  url: ~/.vsrs/vsrs.db
  echo: false

sandbox:
  use_docker: false
  worktree_dir: ~/.vsrs/worktrees
  network_disabled: true
  wall_time_limit_seconds: 300

model:
  # Providers: stub (default, no LLM), openai, anthropic, lmstudio
  # For LM Studio: start local server in LM Studio app, then use:
  #   provider: lmstudio
  #   base_url: http://localhost:1234/v1
  #   model_name: ""  (auto-detect)
  provider: stub
  model_name: ""
  api_key_env: ""
  base_url: null
  max_tokens: 4096
  temperature: 0.2

verification:
  max_repair_attempts: 3
  required_gates:
    - syntax
    - build
    - existing_tests
  optional_gates:
    - type_check
    - lint
    - static_analysis
  pytest_command: pytest
  ruff_command: ruff check
  mypy_command: mypy
  bandit_command: bandit -r

log_dir: ~/.vsrs/logs
log_level: INFO
