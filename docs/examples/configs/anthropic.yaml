# Production configuration with Anthropic Claude 3.5 Sonnet
# Requires ANTHROPIC_API_KEY environment variable

database:
  url: ~/.vsrs/vsrs.db

model:
  provider: anthropic
  model_name: claude-3-5-sonnet-20241022
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 4096
  temperature: 0.2

verification:
  max_repair_attempts: 3
  required_gates:
    - syntax
    - build
    - existing_tests
    - new_targeted_tests
  optional_gates:
    - type_check
    - lint
    - static_analysis
    - security_scan

sandbox:
  use_docker: false
  worktree_dir: ~/.vsrs/worktrees
  network_disabled: true
  wall_time_limit_seconds: 600
